<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>App</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
        <meta name="HandheldFriendly" content="true">
        <!-- You can get rid of the next line if you don't need icons or emojis -->
        <script src="https://kit.fontawesome.com/46bf25baab.js" crossorigin="anonymous"></script>
        <!-- You can get rid of the next ten lines if you don't need syntax highlighting on your html page -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/typescript.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/css.min.js"></script>
        <script>
            document.addEventListener('DOMContentLoaded', event => {
                document.querySelectorAll('code').forEach(el => {
                    hljs.highlightElement(el);
                });
            });
        </script>
        <script>
        // Runs before the stylesheet so dark mode never flashes light first.
        // A saved choice from the nav toggle wins over the device setting.
        (function () {
            var theme;
            try { theme = localStorage.getItem('theme'); } catch (e) { }
            if (theme !== 'light' && theme !== 'dark')
                theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            document.documentElement.dataset.theme = theme;
        })();
        </script>
        <link rel="stylesheet" href="/main.css">
    </head>
    <body>
    </body>
    <script src="/main.js"></script>
</html>
